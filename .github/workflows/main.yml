name: Actualizar Índice de Inercia REE

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Permisos necesarios: escribir contenido (git push del historial)
# y desplegar en GitHub Pages sin Jekyll
permissions:
  contents: write
  pages: write
  id-token: write

# Si llegan dos ejecuciones seguidas, cancelar la más antigua
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        run: python update_index.py

      # Guardar history.json en el repo para que persista entre ejecuciones
      - name: Commit historial
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/history.json
          git diff --staged --quiet || (git commit -m "chore: update $(date -u '+%H:%M UTC')" && git push)

      # Subir docs/ como artefacto de Pages (sin Jekyll, sin branch)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      # Desplegar directamente a GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
